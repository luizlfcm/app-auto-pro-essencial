<style>
:root{--bg:#080B0F;--bg2:#0E1117;--card:#111418;--ch:#181D24;--brd:#1E2530;--acc:#E8720C;--acl:#FFB347;--acd:#C4580A;--glo:rgba(232,114,12,0.15);--txt:#F2F4F6;--mut:#8B95A1;--dim:#4A5568;--grn:#22C55E;--blu:#3B82F6;--r:12px;--rl:18px;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased;direction:ltr;}
/* SPLASH */
#splash{position:fixed;inset:0;z-index:9999;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;}
.sp-logo{font-size:34px;font-weight:800;letter-spacing:-1px;text-align:center;line-height:1.15;padding:0 24px;background:linear-gradient(135deg,#E8720C,#FFB347);-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:fu .8s ease forwards;}
.sp-sub{font-size:12px;color:var(--mut);letter-spacing:2px;text-transform:uppercase;animation:fu .8s .2s ease both;text-align:center;padding:0 32px;line-height:1.6;}
.sp-sub2{font-size:13px;color:var(--acl);text-align:center;padding:0 32px;margin-top:-12px;animation:fu .8s .3s ease both;font-weight:600;}
.sp-bar{width:120px;height:3px;background:var(--brd);border-radius:2px;overflow:hidden;animation:fu .8s .4s ease both;}
.sp-p{height:100%;width:0;background:linear-gradient(90deg,var(--acc),var(--acl));animation:lb 1.8s .5s ease forwards;}
@keyframes lb{to{width:100%;}}@keyframes fu{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}
@keyframes fi{from{opacity:0;}to{opacity:1;}}@keyframes su{from{opacity:0;transform:translateY(24px);}to{opacity:1;transform:translateY(0);}}
/* APP */
#app{display:flex;flex-direction:column;min-height:100vh;}
/* HEADER */
#hdr{position:sticky;top:0;z-index:100;background:rgba(8,11,15,.94);backdrop-filter:blur(16px);border-bottom:1px solid var(--brd);padding:12px 16px;display:flex;align-items:center;gap:10px;}
.hdr-logo{font-size:16px;font-weight:800;background:linear-gradient(135deg,var(--acc),var(--acl));-webkit-background-clip:text;-webkit-text-fill-color:transparent;cursor:pointer;flex-shrink:0;}
.hdr-search{flex:1;position:relative;}
.hdr-search input{width:100%;background:var(--card);border:1px solid var(--brd);border-radius:8px;padding:8px 12px 8px 32px;color:var(--txt);font-size:14px;outline:none;transition:border-color .2s;cursor:pointer;direction:ltr;text-align:left;}
.hdr-search input:focus{border-color:var(--acc);}
.hdr-search input::placeholder{color:var(--dim);}
.si{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--dim);font-size:13px;pointer-events:none;}
.hdr-acts{display:flex;gap:6px;flex-shrink:0;}
.ib{width:34px;height:34px;border-radius:8px;background:var(--card);border:1px solid var(--brd);color:var(--mut);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:15px;transition:all .2s;}
.ib:hover{background:var(--ch);color:var(--acc);border-color:var(--acc);}
/* MAIN */
#main{flex:1;padding-bottom:80px;}
/* BOTTOM NAV */
#nav{position:fixed;bottom:0;left:0;right:0;z-index:100;background:rgba(8,11,15,.96);backdrop-filter:blur(16px);border-top:1px solid var(--brd);display:flex;padding:8px 0 max(8px,env(safe-area-inset-bottom));}
.ni{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;padding:6px 4px;color:var(--dim);font-size:10px;transition:color .2s;border:none;background:none;text-decoration:none;letter-spacing:.3px;}
.ni .ico{font-size:18px;line-height:1;}
.ni.on{color:var(--acc);}
/* PROGRESS */
.pb{height:2px;background:var(--brd);}
.pf{height:100%;background:linear-gradient(90deg,var(--acc),var(--acl));transition:width .3s;}
/* HOME */
.wb{margin:16px;padding:18px;background:linear-gradient(135deg,var(--card),rgba(232,114,12,.06));border:1px solid var(--brd);border-left:3px solid var(--acc);border-radius:var(--rl);}
.wg{font-size:10px;color:var(--acc);font-weight:700;letter-spacing:1px;text-transform:uppercase;margin-bottom:4px;}
.wt{font-size:18px;font-weight:800;margin-bottom:6px;}
.wx{font-size:13px;color:var(--mut);line-height:1.6;}
.sl{padding:0 16px;margin:18px 0 10px;font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--mut);display:flex;align-items:center;gap:8px;}
.sl::after{content:'';flex:1;height:1px;background:var(--brd);}
/* PRODUCT CARDS (home) */
.pg{display:flex;flex-direction:column;gap:10px;padding:0 16px;}
.pc{background:var(--card);border:1px solid var(--brd);border-radius:var(--rl);padding:16px;cursor:pointer;transition:all .25s;position:relative;overflow:hidden;display:flex;align-items:center;gap:14px;}
.pc::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,var(--glo),transparent 60%);opacity:0;transition:opacity .25s;}
.pc:hover{border-color:var(--acc);transform:translateY(-1px);box-shadow:0 0 24px var(--glo);}
.pc:hover::before{opacity:1;}
.pc.lk{opacity:.85;}
.pc.lk:hover{transform:none;border-color:var(--brd);}
.pc-icon{font-size:32px;flex-shrink:0;}
.pc-body{flex:1;min-width:0;}
.pc-name{font-size:15px;font-weight:700;margin-bottom:3px;}
.pc-sub{font-size:12px;color:var(--mut);line-height:1.4;}
.pc-badge{font-size:10px;font-weight:700;padding:3px 8px;border-radius:6px;flex-shrink:0;}
.pc-badge.inc{background:var(--acc);color:#fff;}
.pc-badge.lk2{background:var(--glo);color:var(--acl);border:1px solid var(--acc);animation:pulse 2.2s ease-in-out infinite;}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(232,114,12,.35);}50%{box-shadow:0 0 0 4px rgba(232,114,12,0);}}
.pc-hint{color:var(--acl);font-size:10.5px;font-weight:700;margin-top:6px;}
.pc-badge.unl{background:rgba(34,197,94,.2);color:var(--grn);border:1px solid rgba(34,197,94,.3);}
/* UTILITY CARDS */
.ug{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 16px;}
.uc{background:var(--card);border:1px solid var(--brd);border-radius:var(--r);padding:14px;cursor:pointer;transition:all .2s;text-decoration:none;color:inherit;display:block;}
.uc:hover{border-color:var(--acc);transform:translateY(-1px);}
.uc-icon{font-size:24px;margin-bottom:8px;}
.uc-name{font-size:13px;font-weight:700;margin-bottom:3px;}
.uc-sub{font-size:11px;color:var(--mut);}
/* BONUS */
.bg{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 16px;}
.bc{background:var(--card);border:1px solid var(--brd);border-radius:var(--r);padding:12px;text-decoration:none;color:inherit;display:block;transition:all .2s;}
.bc:hover{border-color:var(--acl);transform:translateY(-1px);}
.bic{font-size:20px;margin-bottom:6px;}
.bn{font-size:12px;font-weight:700;margin-bottom:3px;line-height:1.3;}
.bd{font-size:11px;color:var(--mut);line-height:1.4;}
.bl{display:inline-block;margin-top:6px;font-size:10px;font-weight:700;color:var(--acc);letter-spacing:.5px;text-transform:uppercase;}
/* SUB-APP HEADER */
.sah{padding:14px 16px;border-bottom:1px solid var(--brd);display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:50;background:rgba(8,11,15,.95);backdrop-filter:blur(12px);}
.bb{width:34px;height:34px;border-radius:8px;background:var(--card);border:1px solid var(--brd);color:var(--txt);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:20px;flex-shrink:0;transition:all .2s;}
.bb:hover{border-color:var(--acc);}
.sat{flex:1;}
.sat-icon{font-size:18px;}
.sat-name{font-size:16px;font-weight:700;}
.sat-sub{font-size:11px;color:var(--mut);margin-top:1px;}
/* DOWNLOAD BUTTON */
.dl-wrap{padding:12px 16px;}
.dl-btn{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--card);border:1px solid var(--brd);color:var(--txt);padding:12px;border-radius:var(--r);font-size:13px;font-weight:600;cursor:pointer;text-decoration:none;transition:all .2s;width:100%;}
.dl-btn:hover{border-color:var(--acc);color:var(--acc);}
/* CATEGORY CARDS (inside sub-app) */
.cg{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 16px;}
.cc{background:var(--card);border:1px solid var(--brd);border-radius:var(--rl);padding:16px 13px;cursor:pointer;transition:all .25s;position:relative;overflow:hidden;text-decoration:none;color:inherit;display:block;}
.cc::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,var(--glo),transparent 60%);opacity:0;transition:opacity .25s;}
.cc:hover{border-color:var(--acc);transform:translateY(-2px);}
.cc:hover::before{opacity:1;}
.ci{font-size:24px;margin-bottom:8px;display:block;}
.cn{font-size:13px;font-weight:700;margin-bottom:3px;line-height:1.3;}
.ck{font-size:11px;color:var(--mut);}
/* FORMULA LIST */
.fl{padding:8px 16px;}
.fi{background:var(--card);border:1px solid var(--brd);border-radius:var(--r);padding:14px;margin-bottom:8px;cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:12px;}
.fi:hover{border-color:var(--acc);background:var(--ch);}
.fi.sv{border-left:3px solid var(--acc);}
.fi.vd{border-left:3px solid var(--grn);}
.fi.lk{opacity:.68;}
/* PREVIEW MODE */
.prevbar{margin:12px 16px 0;padding:12px 14px;background:linear-gradient(135deg,var(--acc),var(--acd));border-radius:var(--r);display:flex;align-items:center;gap:10px;box-shadow:0 4px 18px rgba(232,114,12,.3);}
.prevbar-tx{flex:1;font-size:12px;font-weight:700;line-height:1.4;color:#fff;}
.prevbar-cta{background:#fff;color:var(--acd);padding:8px 14px;border-radius:20px;font-size:11px;font-weight:800;text-decoration:none;white-space:nowrap;flex-shrink:0;}
.fic{flex:1;min-width:0;}
.fit{font-size:14px;font-weight:600;margin-bottom:4px;}
.fid{font-size:12px;color:var(--mut);line-height:1.4;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}
.far{color:var(--dim);font-size:20px;flex-shrink:0;}
/* FORMULA DETAIL */
.fh{padding:18px 16px;border-bottom:1px solid var(--brd);background:linear-gradient(135deg,var(--card),rgba(232,114,12,.04));}
.ftm{font-size:20px;font-weight:800;line-height:1.2;margin-bottom:6px;}
.fdm{font-size:13px;color:var(--mut);line-height:1.6;}
.fav-btn{display:flex;align-items:center;gap:6px;background:var(--bg2);border:1px solid var(--brd);color:var(--mut);font-size:12px;font-weight:600;padding:8px 14px;border-radius:8px;cursor:pointer;transition:all .2s;margin-top:12px;}
.fav-btn.on{color:var(--acc);border-color:var(--acc);background:var(--glo);}
/* DETAIL SECTIONS */
.sb{padding:16px;border-bottom:1px solid var(--brd);}
.sb:last-child{border-bottom:none;}
.bt{font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--acc);margin-bottom:12px;display:flex;align-items:center;gap:8px;}
.bt::after{content:'';flex:1;height:1px;background:rgba(232,114,12,.2);}
.ul2{display:flex;flex-wrap:wrap;gap:6px;}
.ut2{background:var(--card);border:1px solid var(--brd);color:var(--mut);font-size:11px;padding:4px 9px;border-radius:6px;}
table.ft,table.dt{width:100%;border-collapse:collapse;}
table.ft th,table.dt th{background:var(--bg2);color:var(--mut);font-size:9px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;padding:7px 10px;text-align:left;border-bottom:1px solid var(--brd);}
table.ft td,table.dt td{padding:8px 10px;font-size:12px;border-bottom:1px solid var(--brd);vertical-align:top;}
table.ft tr:last-child td,table.dt tr:last-child td{border-bottom:none;}
table.ft tr:hover td,table.dt tr:hover td{background:var(--ch);}
table.ft td:last-child{color:var(--acl);font-weight:700;font-family:'Courier New',monospace;text-align:right;white-space:nowrap;}
.dr{font-family:'Courier New',monospace;font-weight:700;color:var(--acc);font-size:13px;}
.de{color:var(--mut);font-size:11px;}
.ifl{display:flex;flex-direction:column;gap:9px;}
.ifi{display:flex;gap:10px;}
.ifn{font-size:11px;font-weight:700;color:var(--acl);flex-shrink:0;min-width:120px;}
.ifd{font-size:12px;color:var(--mut);line-height:1.5;}
.pl{display:flex;flex-direction:column;gap:10px;}
.ps{display:flex;gap:10px;align-items:flex-start;}
.pn{width:24px;height:24px;border-radius:50%;background:var(--acc);color:#fff;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.ptx{font-size:13px;line-height:1.6;padding-top:2px;}
.wl{display:flex;flex-direction:column;gap:7px;}
.wi{display:flex;gap:9px;align-items:flex-start;background:var(--card);border-radius:8px;padding:9px 10px;border:1px solid var(--brd);}
.wic{font-size:13px;flex-shrink:0;}
.wtx{font-size:12px;color:var(--mut);line-height:1.5;}
.ig{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.ip{background:var(--card);border:1px solid var(--brd);border-radius:8px;padding:10px;}
.ipl{font-size:9px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--dim);margin-bottom:4px;}
.ipv{font-size:12px;line-height:1.4;}
.sales{background:linear-gradient(135deg,var(--glo),transparent);border:1px solid rgba(232,114,12,.3);border-radius:var(--r);padding:13px;}
.sq{font-size:13px;font-weight:600;line-height:1.5;font-style:italic;margin-bottom:6px;}
.cn2{font-size:11px;color:var(--mut);line-height:1.5;}
/* LEGALIZAÇÃO */
.lg-card{background:var(--card);border:1px solid var(--brd);border-radius:var(--r);padding:15px;margin-bottom:8px;cursor:pointer;transition:all .2s;display:flex;align-items:flex-start;gap:12px;}
.lg-card:hover{border-color:var(--blu);background:var(--ch);}
.lg-num{width:28px;height:28px;border-radius:50%;background:var(--blu);color:#fff;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.lg-body{flex:1;}
.lg-title{font-size:14px;font-weight:700;margin-bottom:3px;}
.lg-sub{font-size:12px;color:var(--mut);line-height:1.4;}
/* EXCLUSIVA */
.ex-box{margin:16px;padding:20px;background:linear-gradient(135deg,rgba(139,92,246,.12),rgba(139,92,246,.04));border:1px solid rgba(139,92,246,.3);border-radius:var(--rl);}
.ex-step{display:flex;gap:12px;margin-bottom:14px;align-items:flex-start;}
.ex-num{width:28px;height:28px;border-radius:50%;background:rgba(139,92,246,.8);color:#fff;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.ex-txt{font-size:13px;line-height:1.6;padding-top:4px;}
.ex-msg{background:var(--card);border:1px solid var(--brd);border-radius:var(--r);padding:14px;margin:0 16px 14px;font-size:13px;line-height:1.7;color:var(--mut);}
.wa-btn{display:flex;align-items:center;justify-content:center;gap:10px;background:#25D366;color:#fff;padding:14px;border-radius:var(--r);font-size:15px;font-weight:700;text-decoration:none;margin:0 16px;transition:opacity .2s;}
.wa-btn:hover{opacity:.9;}
/* SEARCH */
#search-wrap{padding:14px 16px;border-bottom:1px solid var(--brd);}
#search-inp{width:100%;background:var(--card);border:1px solid var(--acc);border-radius:8px;padding:12px 14px 12px 36px;color:var(--txt);font-size:15px;outline:none;direction:ltr;text-align:left;unicode-bidi:embed;}
#search-icon{position:absolute;left:26px;top:50%;transform:translateY(-50%);color:var(--mut);pointer-events:none;}
#search-results{min-height:200px;animation:fi .2s ease;}
/* GLOSSARY */
.gs{padding:12px 16px;background:var(--bg);border-bottom:1px solid var(--brd);}
.gs input{width:100%;background:var(--card);border:1px solid var(--brd);border-radius:8px;padding:10px 13px;color:var(--txt);font-size:14px;outline:none;direction:ltr;}
.gs input:focus{border-color:var(--acc);}
.gw{overflow-x:auto;}
table.gt{width:100%;border-collapse:collapse;min-width:560px;}
table.gt th{background:var(--bg2);color:var(--mut);font-size:9px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;padding:7px 10px;text-align:left;border-bottom:1px solid var(--brd);}
table.gt td{padding:8px 10px;font-size:11px;border-bottom:1px solid var(--brd);vertical-align:top;}
table.gt tr:hover td{background:var(--ch);}
.gn{font-weight:700;color:var(--txt);font-size:12px;}
.gm{color:var(--mut);}
.gp{color:var(--acl);font-weight:600;white-space:nowrap;}
/* SUPPLIERS */
.sr{padding:10px 16px 4px;font-size:9px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--acc);}
.sc{margin:0 16px 7px;background:var(--card);border:1px solid var(--brd);border-radius:var(--r);padding:12px;}
.sn{font-size:13px;font-weight:700;margin-bottom:2px;}
.sct{font-size:11px;color:var(--mut);margin-bottom:3px;}
.sco{font-size:11px;color:var(--mut);}
/* EMPTY */
.es{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 32px;text-align:center;}
.ei{font-size:44px;margin-bottom:12px;opacity:.5;}
.et{font-size:17px;font-weight:700;margin-bottom:6px;}
.ex2{font-size:13px;color:var(--mut);line-height:1.5;}
/* WA FLOAT BTN */
.wa-float{position:fixed;bottom:88px;right:14px;z-index:200;width:48px;height:48px;border-radius:50%;background:#25D366;color:#fff;display:flex;align-items:center;justify-content:center;font-size:22px;text-decoration:none;box-shadow:0 4px 16px rgba(37,211,102,.4);transition:transform .2s;}
.wa-float:hover{transform:scale(1.08);}
/* INSTALL */
#ip{position:fixed;inset:0;z-index:500;background:rgba(0,0,0,.85);backdrop-filter:blur(10px);display:none;align-items:center;justify-content:center;padding:20px;}
#ip.open{display:flex;}
.ip-box{background:var(--card);border:2px solid var(--acc);border-radius:var(--rl);padding:22px 18px;width:100%;max-width:440px;animation:su .3s ease;box-shadow:0 0 50px var(--glo);}
.ip-title{font-size:16px;font-weight:800;margin-bottom:5px;text-align:center;}
.ip-sub{font-size:12px;color:var(--mut);text-align:center;margin-bottom:18px;}
.ip-tabs{display:flex;gap:8px;margin-bottom:14px;}
.ip-tab{flex:1;padding:8px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;border:1px solid var(--brd);background:var(--bg2);color:var(--mut);text-align:center;transition:all .2s;}
.ip-tab.on{background:var(--acc);color:#fff;border-color:var(--acc);}
.ip-steps{display:flex;flex-direction:column;gap:9px;margin-bottom:16px;}
.ip-step{display:flex;gap:10px;align-items:flex-start;}

  </div>`;
}
function bindSearch(){
  const inp=$('search-inp');
  if(!inp)return;
  inp.focus();
  // Restore previous search
  if(S.searchQ){inp.value=S.searchQ;doSearch(S.searchQ);}
  inp.addEventListener('input',e=>{
    const q=e.target.value;
    S.searchQ=q;
    doSearch(q);
  });
  inp.addEventListener('keydown',e=>{
    // Force cursor to end on each keystroke (RTL fix)
    requestAnimationFrame(()=>{
      if(inp.selectionStart!==inp.value.length){
        // Don't force if user is editing middle of text
      }
    });
  });
}
function doSearch(q){
  const el=$('search-results');
  if(!el)return;
  const qn=q.toLowerCase().trim();
  if(qn.length<2){
    el.innerHTML='<div class="es"><div class="ei">🔍</div><div class="et">Digite para buscar</div><div class="ex2">Mínimo 2 caracteres</div></div>';
    return;
  }
  const all=[...AF,...LF];
  const rs=all.filter(f=>
    f.title.toLowerCase().includes(qn)||
    f.desc.toLowerCase().includes(qn)||
    (f.catName||'').toLowerCase().includes(qn)||
    (f.uses||[]).some(u=>u.toLowerCase().includes(qn))
  );
  if(!rs.length){
    el.innerHTML='<div class="es"><div class="ei">😔</div><div class="et">Nenhum resultado</div><div class="ex2">Tente outros termos</div></div>';
    return;
  }
  el.innerHTML=`<div class="fl">${rs.map(f=>{
    const isAuto=AF.includes(f);
    const isLimp=LF.includes(f);const act=isLimp?'limp-form':'auto-form';
    const catKey=isAuto?'autoCat':'limpCat';
    return`<div class="fi${isFav(f.id)?' sv':''}" data-action="${act}" data-id="${f.id}" data-cat="${f.cat}">
      <div class="fic">
        <div style="font-size:10px;color:var(--acc);margin-bottom:2px;font-weight:700">${f.catIcon||''} ${f.catName||''}</div>
        <div class="fit">${f.title}</div>
        <div class="fid">${f.desc}</div>
      </div>
      <div class="far">›</div>
    </div>`;
  }).join('')}</div>`;
  bindCommon();
}

// ── EVENT BINDING ──────────────────────────────────────────────────
function bindCommon(){
  document.querySelectorAll('[data-action]').forEach(el=>{
    // Avoid double-binding
    if(el._bound)return;
    el._bound=true;
    el.addEventListener('click',handleClick);
  });
  const gi=$('gi');
  if(gi)gi.addEventListener('input',e=>{
    const q=e.target.value.toLowerCase();
    document.querySelectorAll('#gb tr').forEach(r=>{
      r.style.display=r.textContent.toLowerCase().includes(q)?'':'none';
    });
  });
}

function handleClick(e){
  const el=e.currentTarget,ac=el.dataset.action;
  switch(ac){
    case'go': go(el.dataset.v);break;
    case'upsell': {
      const key=el.dataset.key;
      if(key&&!S.access[key]&&CHECKOUT_URLS[key]){
        _fapPixel('InitiateCheckout',{content_name:key});
        window.open(ckUrl(key),'_blank');
      }
      break;
    }
    case'track-previa': _fapPixel('ViewContent',{content_name:'Prévia do app completo (via Essencial)',content_category:'preview_from_essencial'});break;
    case'track-checkout': {
      _fapPixel('InitiateCheckout',{content_name:el.dataset.produto||''});
      try{localStorage.setItem('fap_buy_intent','1');}catch(e){}
      setTimeout(function(){if(S.preview)render();},400);
      break; // navegação padrão do <a href target=_blank> acontece normalmente
    }
    case'download-pdf': {
      const produto=el.dataset.produto;
      const hasAcc=S.access[produto]||S.access.admin;
      if(!hasAcc){
        alert('Esse PDF fica disponível depois da compra. Desbloqueie o acesso completo para baixar.');
        return;
      }
      const prevTxt=el.textContent;
      el.textContent='Baixando...';el.disabled=true;
      const email=localStorage.getItem('fap_email')||'';
      const tk='';
      fetch('/api/download?produto='+encodeURIComponent(produto)+'&email='+encodeURIComponent(email)+(tk?'&token='+tk:''),{cache:'no-store'})
        .then(function(r){ if(!r.ok)throw new Error('fail'); return r.blob(); })
        .then(function(blob){
          const url=URL.createObjectURL(blob);
          const a=document.createElement('a');
          a.href=url;a.download=PDF_NAMES[produto]||'documento.pdf';
          document.body.appendChild(a);a.click();a.remove();
          setTimeout(function(){URL.revokeObjectURL(url);},2000);
          el.textContent=prevTxt;el.disabled=false;
        })
        .catch(function(){
          alert('Não foi possível baixar agora. Tente novamente ou fale com o suporte.');
          el.textContent=prevTxt;el.disabled=false;
        });
      break;
    }
    case'auto-cat': go('auto-cat',{autoCat:el.dataset.cat});break;
    case'auto-form': go('auto-form',{autoForm:el.dataset.id,autoCat:el.dataset.cat||S.autoCat});break;
    case'limp-cat': go('limp-cat',{limpCat:el.dataset.cat});break;
    case'limp-form': go('limp-form',{limpForm:el.dataset.id,limpCat:el.dataset.cat||S.limpCat});break;
    case'leg-cap': go('legal-cap',{legCap:el.dataset.id});break;
    case'back-cat': go(el.dataset.view,{autoCat:el.dataset.cat,limpCat:el.dataset.cat});break;
    case'fav': togFav(el.dataset.id,e);break;
    case'ip-tab': S.instTab=el.dataset.tab;S._instTabManual=true;renderInstTabs();break;
  }
}

// ── INSTALL PROMPT ─────────────────────────────────────────────────
function openInst(){
  // Detecta o sistema automaticamente pra já abrir na aba certa
  if(!S._instTabManual){
    const ua=navigator.userAgent||'';
    S.instTab=/Android/i.test(ua)?'and':'ios';
  }
  $('ip').classList.add('open');renderInstTabs();
}
function closeInst(){$('ip').classList.remove('open');}

async function installNativo(){
  if(!dP)return;
  dP.prompt();
  const escolha=await dP.userChoice;
  if(escolha.outcome==='accepted'){
    closeInst();
  }
  dP=null;
}

function detectaNavegadorApp(){
  const ua=navigator.userAgent||'';
  const isInstagram=/Instagram/i.test(ua);
  const isFacebook=/FBAN|FBAV|FB_IAB/i.test(ua);
  const isWhatsApp=/WhatsApp/i.test(ua);
  const isLine=/Line\//i.test(ua);
  const isTikTok=/TikTok|BytedanceWebview/i.test(ua);
  if(isInstagram)return'Instagram';
  if(isFacebook)return'Facebook';
  if(isWhatsApp)return'WhatsApp';
  if(isTikTok)return'TikTok';
  if(isLine)return'Line';
  return null;
}

function renderInstTabs(){
  const box=$('ip-box');
  if(!box)return;

  // Se o navegador oferece instalação nativa (Android/Chrome/Edge), mostra botão de 1 toque
  if(dP){
    box.innerHTML=`
    <div class="ip-title">📲 Instalar no Celular</div>
    <div class="ip-sub">Acesse offline, sem internet, igual a um app</div>
    <div style="text-align:center;padding:24px 0 8px">
      <div style="font-size:44px;margin-bottom:14px">⚡</div>
      <p style="font-size:13px;color:var(--mut);margin-bottom:18px">Seu navegador já suporta instalação com 1 toque.</p>
    </div>
    <button class="ip-close" style="background:linear-gradient(135deg,var(--acc),var(--acd));color:#fff;border:none;font-weight:700;margin-bottom:10px" onclick="installNativo()">📲 Instalar Agora</button>
    <button class="ip-close" onclick="closeInst()">Agora não</button>`;
    return;
  }

  // Sem prompt nativo disponível — mostra passo a passo (obrigatório no iPhone/Safari)
  const ios=S.instTab==='ios';
  const appDetectado=detectaNavegadorApp();
  const avisoAppInterno=(ios&&appDetectado)?`
    <div style="background:rgba(232,114,12,.12);border:1px solid var(--acc);border-radius:10px;padding:12px 14px;margin-bottom:16px;text-align:left">
      <div style="font-size:12px;font-weight:800;color:var(--acl);margin-bottom:6px">⚠️ Você está no navegador do ${appDetectado}</div>
      <div style="font-size:12px;color:var(--txt);line-height:1.5">O ${appDetectado} não permite instalar apps. Toque nos <b>●●●</b> ou <b>⋯</b> (menu, geralmente no canto superior direito) e escolha <b>"Abrir no Safari"</b> ou <b>"Abrir no navegador"</b> antes de continuar.</div>
    </div>
  `:'';
  const steps=ios?[
    'Confirme que está usando o <b>Safari</b> (obrigatório no iPhone — não funciona no navegador do WhatsApp/Instagram)',
    'Toque no ícone <b>⬆</b> na barra inferior',
    'Toque em <b>"Adicionar à Tela de Início"</b>',
    'Confirme com <b>Adicionar</b> — ícone aparece na tela!',
  ]:[
    'Abra este link no <b>Google Chrome</b>',
    'Toque nos 3 pontos <b>⋮</b> no canto superior',
    'Toque em <b>"Instalar aplicativo"</b>',
    'Confirme com <b>Instalar</b> — ícone aparece na tela!',
  ];
  box.innerHTML=`
  <div class="ip-title">📲 Instalar no Celular</div>
  <div class="ip-sub">Acesse offline, sem internet, igual a um app</div>
  <div class="ip-tabs">
    <div class="ip-tab${ios?' on':''}" data-action="ip-tab" data-tab="ios">🍎 iPhone</div>
    <div class="ip-tab${!ios?' on':''}" data-action="ip-tab" data-tab="and">🤖 Android</div>
  </div>
  ${avisoAppInterno}
  <div class="ip-steps">${steps.map((s,i)=>`<div class="ip-step"><div class="ip-n">${i+1}</div><div class="ip-t">${s}</div></div>`).join('')}</div>
  <button class="ip-close" onclick="closeInst()">Entendi ✓</button>`;
  document.querySelectorAll('[data-action="ip-tab"]').forEach(el=>{
    el._bound=false;el.addEventListener('click',handleClick);
  });
}

let dP=null;
window.addEventListener('beforeinstallprompt',e=>{
  e.preventDefault();
  dP=e;
  if($('ip')&&$('ip').classList.contains('open'))renderInstTabs();
});
window.addEventListener('appinstalled',()=>{dP=null;});

function init(){
  S.access=parseAccess();
  setTimeout(function(){
    var sp=document.getElementById('splash'),ap=document.getElementById('app');
    if(sp){sp.style.opacity='0';sp.style.transition='opacity .5s';}
    setTimeout(function(){
      if(sp)sp.style.display='none';
      // Sem acesso — mostra tela de login OU retoma/inicia o Modo Prévia
      if(!S.access.base&&!S.access.admin){
        var pParams=new URLSearchParams(location.search);
        if(!S.preview&&pParams.get('preview')==='1'){
          // Chegou direto de um link "conheça a plataforma" (ex: da PV) — pula a tela de escolha
          _fapStartPreview();
          return;
        }
        if(S.preview){
          if(ap)ap.removeAttribute('hidden');
          render();
          _fapPixel('ViewContent',{content_name:'Fórmula Auto Pro Essencial - Modo Prévia',content_category:'preview_mode'});
          setTimeout(_fapBgRefresh,1000);
          return;
        }
        _fapShowLogin();
        return;
      }
      if(ap)ap.removeAttribute('hidden');
      _fapLoadLocked();
      render();
      var standalone=window.matchMedia('(display-mode:standalone)').matches||navigator.standalone;
      if(!standalone&&!localStorage.getItem('fap_inst_shown')){
        setTimeout(openInst,1500);
        localStorage.setItem('fap_inst_shown','1');
      }
      // Background refresh — atualiza permissões sem bloquear nada
      setTimeout(_fapBgRefresh,1000);
    },520);
  },2000);
  document.querySelectorAll('.ni').forEach(el=>{
    el.addEventListener('click',()=>{const v=el.dataset.v;if(v)go(v);});
  });
  $('hdr-logo')?.addEventListener('click',()=>go('home'));
  $('hdr-s-btn')?.addEventListener('click',()=>go('search'));
  $('hdr-f-btn')?.addEventListener('click',()=>go('favs'));
  $('hdr-inst-btn')?.addEventListener('click',openInst);
}
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('/sw.js').catch(()=>{});
  });
}

,"como funciona o suporte","tem suporte","vocês têm suporte","como funciona o atendimento","quem me atende"],k:["joão","whatsapp","suporte","contato","telefone"],a:"Claro! O suporte direto é com o **João Silva**:\n\n📱 WhatsApp: **"+o+"**\n✉️ E-mail: **contato@luverisgroup.com.br**\n⏱️ Respondemos em até 24h em dias úteis.\n\nPara agilizar, mande o **e-mail da compra** e descreva a dúvida (com print, se possível).",btns:["wa"],chips:["Horário de atendimento"]},{id:"horario",t:"Horário de atendimento",q:["horário de atendimento","que horas o joão responde","em quanto tempo respondem","quando respondem","prazo de resposta","demora para responder","atende fim de semana","atende domingo","o joão está online"],k:["horário","prazo de resposta"],a:"O João responde em **até 24 horas em dias úteis**, em geral bem antes disso. Para ser atendido mais rápido, já envie na primeira mensagem: seu **e-mail da compra** e a **dúvida com detalhes** (e print, se tiver). 💬",btns:["wa"]},{id:"duvida_producao",t:"Dúvida na produção com o João",q:["tenho dúvida na produção","deu problema no meu lote","meu lote estragou","preciso de ajuda com a fórmula","a fórmula não deu certo","o produto não ficou bom","perdi o lote","ajuda urgente com a produção","não deu certo minha fórmula","não ficou igual","fiz errado"],k:["lote","não deu certo"],a:'Poxa, vamos resolver. Antes, veja se uma destas situações bate com a sua:\n\n• Produto **ralo / aguado** · **muita espuma** · **turvo ou separou**\n• **Cheiro** estranho · **pH** fora do esperado · **cor** diferente\n\nEscreva uma delas (ex.: "meu produto ficou ralo") que eu te explico as causas. Se não resolver, o João te orienta direto — leve: **qual fórmula, quanto fez, o que usou de ingrediente (marca) e o que aconteceu**. 💬',chips:["Meu produto ficou ralo","Produto separou/turvo","Muita espuma","Falar com o João"],btns:["wa"]},{id:"elogio",t:"Quero elogiar / dar sugestão",q:["quero elogiar","sugestão","sugerir fórmula","queria uma fórmula nova","tem como adicionar uma fórmula","feedback","reclamação","quero reclamar","tenho uma sugestão","adoraria ter","poderiam fazer"],k:["sugestão","reclamação","elogio"],a:"Que bom receber isso! 😊 Elogios, sugestões de fórmulas e reclamações vão direto para o João — manda no WhatsApp **"+o+"** que ele lê. Ideias dos alunos ajudam a decidir o que entra nas próximas atualizações.",btns:["wa"]},{id:"epi",t:"Cuidados de segurança",q:["cuidados de segurança","preciso de luva","equipamento de proteção","usar máscara","segurança na produção","é perigoso","epi","óculos de proteção","proteção ao fabricar","posso fazer sem luva","é tóxico","fazer em casa é seguro","ventilação","quais cuidados ao fabricar"],k:["segurança","luvas","epi"],a:'Segurança em primeiro lugar! 🥽 Ao produzir:\n\n• Use **luvas, óculos de proteção e máscara** (principalmente com soda, ácidos, cloro e pós finos).\n• Trabalhe em local **ventilado**, longe de crianças, animais e comida.\n• **Nunca misture produtos por conta própria** (veja "o que nunca misturar").\n• Use recipientes limpos e de plástico/inox; **rotule tudo**.\n• Teste em **lote pequeno** antes de fazer grande quantidade.\n• Leia o **cuidados** de cada fórmula no app.',chips:["O que nunca misturar","Ordem de adição dos ingredientes","E se eu me queimar?"]},{id:"nunca_misturar",t:"O que nunca misturar",q:["o que nunca misturar","posso misturar água sanitária com vinagre","misturar cloro com amônia","misturar produtos de limpeza","misturar ácido com cloro","misturar alvejante","posso juntar dois produtos","misturar desinfetante com água sanitária","gás tóxico","misturar soda com ácido","misturar água sanitária com álcool","cloro com ácido","misturei e deu fumaça"],k:["misturar","gás tóxico","água sanitária"],a:"⚠️ **Nunca misture por conta própria:**\n\n• **Água sanitária/cloro + ácidos** (vinagre, ácido muriático, limpa-pedras, removedores) → libera **gás cloro**, muito tóxico.\n• **Água sanitária + amônia** (ou limpa-vidros com amônia) → gases tóxicos.\n• **Água sanitária + álcool** → gera substâncias irritantes e perigosas.\n• **Ácido forte + soda** → reação violenta com calor.\n\nUse **somente as combinações das fórmulas do curso**, na ordem indicada. Se sentir cheiro forte, saia do local, ventile e procure ar fresco.",chips:["E se eu me queimar?","Ordem de adição dos ingredientes"]},{id:"acidente",t:"E se eu me queimar?",q:["e se eu me queimar","queimou a pele","respingou no olho","irritou a pele","engoli produto","inalei gás","acidente com produto químico","intoxicação","primeiros socorros","criança tomou produto","cheiro forte passei mal","tontura com cheiro","queimadura química","respirei vapor"],k:["queimadura","intoxicação","acidente","socorro"],a:"🚨 **Em caso de acidente, aja já:**\n\n• **Pele/olhos:** lave com **água corrente em abundância por pelo menos 15 minutos** e retire roupas contaminadas.\n• **Inalação:** vá para um local arejado.\n• **Ingestão:** **não provoque vômito**; leve a embalagem/rótulo.\n\nLigue para o **Disque-Intoxicação: 0800 722 6001** (24h, gratuito) ou **SAMU: 192**, ou vá a um pronto-socorro. Em seguida, se quiser, avise o João.",btns:[{l:"Ligar Disque-Intoxicação",url:"tel:08007226001"}]},{id:"ordem_adicao",t:"Ordem de adição dos ingredientes",q:["ordem de adição dos ingredientes","qual ingrediente coloco primeiro","ácido na água ou água no ácido","como dissolver a soda","ordem de misturar","o que adiciono primeiro","posso misturar tudo junto","em que ordem misturo","dissolver soda cáustica","colocar tensoativo antes da água","a ordem importa"],k:["ordem","dissolver soda"],a:"A **ordem importa**. Regras de ouro (e siga sempre a sequência de cada fórmula):\n\n1. Comece pela **água** no tanque.\n2. **Ácidos e soda:** adicione sempre **o produto na água, devagar** — nunca água sobre ácido/soda concentrados (a reação esquenta e respinga).\n3. **Tensoativo (espumante):** acrescente **aos poucos e devagar** para não formar espuma demais.\n4. **Sal:** por último de espessar, **aos poucos**, testando a viscosidade.\n5. **Essência, corante e conservante** no final, com a mistura já homogênea.\n6. Misture **lentamente** e deixe **descansar** antes de medir o pH e envasar.",chips:["Meu produto ficou ralo","Muita espuma","Como medir o pH?"]},{id:"ph",t:"Como medir o pH?",q:["como medir o ph","qual o ph ideal","fita de ph","preciso de phmetro","o que é ph","ph do produto","ph de limpeza","ph ideal do multiuso","como saber se o ph está certo","medidor de ph","o ph está fora","ph muito alto","ph muito baixo","como corrigir o ph","como baixar o ph","como subir o ph","ajustar ph","neutralizar"],k:["ph","phmetro","fita de ph"],a:"O **pH** diz se o produto é ácido (baixo) ou alcalino (alto). Para produtos de limpeza geral (multiuso, detergente, sabão), o ideal costuma ficar **entre 6 e 8** — cada fórmula informa o valor-alvo.\n\n**Como medir:** use **fita de pH** (barata e prática) ou um **pHmetro** (mais preciso). Meça com a mistura já homogênea e descansada.\n\n**Como corrigir:**\n• pH **alto** → adicione **ácido cítrico** (solução diluída) aos poucos.\n• pH **baixo** → adicione **solução de soda** bem diluída, devagar, mexendo e medindo a cada ajuste.\n\nSempre com luvas e óculos, e em passos pequenos.",chips:["Cuidados de segurança","Ordem de adição dos ingredientes"]},{id:"ralo",neg:!0,t:"Meu produto ficou ralo",q:["meu produto ficou ralo","ficou aguado","não engrossou","como engrossar","como deixar mais grosso","ficou muito líquido","produto fino demais","viscosidade baixa","aumentar a viscosidade","o detergente não engrossa","o shampoo ficou ralo","perdeu a viscosidade","ficou mais ralo depois de colocar sal","sal engrossar"],k:["ralo","engrossar","viscosidade"],a:'Para **engrossar**, o ajuste clássico é o **sal (cloreto de sódio)**, mas com técnica:\n\n• Adicione **aos poucos**, mexendo bem e **testando a cada adição**.\n• ⚠️ Acima de ~**1%** o efeito **inverte** e o produto fica **mais ralo** — esse é o erro mais comum!\n• A viscosidade final só aparece depois de **descansar** (algumas horas).\n• Alguns produtos precisam de outro espessante (ex.: goma xantana, HEC) — veja no glossário.\n• Água em excesso, tensoativo fraco ou pouco tensoativo também deixam ralo.\n\nTem uma fórmula específica em mente? Me diga o nome e eu mostro os "erros comuns" dela.',chips:["O que é goma xantana?","Muita espuma"]},{id:"espuma",t:"Muita espuma / pouca espuma",q:["muita espuma","espuma demais","não faz espuma","pouca espuma","como reduzir espuma","espuma na hora de misturar","espumou muito","como aumentar a espuma","o produto não espuma","espuma no tanque","espuma não baixa","antiespumante"],k:["espuma"],a:"**Espuma demais na produção:** adicione o tensoativo **devagar**, com a pá rente à parede do recipiente e agitação suave, sem bater. Deixe a espuma **descansar/baixar** antes de continuar. Em lotes maiores, misture em **rotação baixa**.\n\n**Pouca espuma:** confira se usou o **tensoativo certo e na quantidade da fórmula** (LESS 27% vs 70% mudam a quantidade!), se a água é muito dura (use o **EDTA**) e se a dosagem de sal está correta.\n\nFórmulas de limpeza pesada ou de chão podem ser de **baixa espuma de propósito**.",chips:["O que é EDTA?","LESS 27% e 70%: qual a diferença?"]},{id:"turvo",neg:!0,t:"Produto separou / turvo",q:["produto separou","ficou turvo","ficou leitoso","apareceram grumos","talhou","o produto ficou em duas fases","depósito no fundo","precipitou","ficou embaçado","borra no fundo","separação de fases","ficou com grumo","flocos no produto","por que turvou"],k:["separou","turvo","grumos","precipitou"],a:"Produto **turvo, separado ou com grumos** quase sempre vem de um destes motivos:\n\n• **Ordem errada** de adição ou mistura rápida demais.\n• **Sal em excesso** ou adicionado de uma vez.\n• **Água dura** (use o sequestrante **EDTA**) — prefira água filtrada/deionizada.\n• **Essência/perfume sem solubilizante** — fragrâncias oleosas precisam de um tensoativo não iônico/solubilizante.\n• Ingredientes **frios ou mal dissolvidos** (dissolva pós em água morna à parte).\n• pH fora da faixa.\n\nRefaça em lote pequeno corrigindo um fator por vez. Se quiser, me diga a fórmula e o que viu.",chips:["Essência não mistura","Como medir o pH?"]},{id:"essencia",t:"Essência não mistura",q:["essência não mistura","fragrância separa","essência boia","como misturar essência","perfume não dissolve","óleo essencial não mistura","essência fica em cima","essência cortou o produto","quanto de essência usar","solubilizar essência","a essência desandou o produto"],k:["essência","fragrância","solubilizar"],a:"Essências são oleosas e podem boiar ou turvar o produto. Para misturar bem:\n\n• **Misture a essência com um pouco do tensoativo/solubilizante** (ex.: não iônico) **antes** de colocar no tanque.\n• Adicione no **final**, com o produto já pronto e homogêneo, sob agitação suave.\n• Respeite a **dosagem da fórmula** — excesso de essência faz turvar e pode alterar a viscosidade.\n• Prefira essências **próprias para base aquosa/limpeza**.\n\nCada fórmula informa as fragrâncias indicadas e a quantidade.",chips:["Produto separou/turvo","Fórmulas com fragrância"]},{id:"cheiro",neg:!0,t:"Cheiro ruim / produto estragou",q:["cheiro ruim","produto está com mau cheiro","azedou","mofo no produto","apareceu mofo","produto estragou","cheiro de podre","fedendo","bolhas no frasco","inchou o frasco","produto com fungo","bactéria no produto","cheiro de azedo","por que estraga","cheiro estranho","o cheiro mudou","cheiro diferente"],k:["mau cheiro","mofo","azedou","estragou"],a:"Cheiro ruim, mofo ou frasco estufando indicam **contaminação**. As causas mais comuns:\n\n• **Faltou conservante** (ou dose errada) — ele evita mofo e bactérias.\n• Água, balde, tanque ou frasco **mal higienizados**.\n• Produto armazenado **aberto**, no calor ou ao sol.\n\n**Para evitar:** higienize tudo antes (lave e enxágue bem), use **conservante na dose da fórmula**, envase em embalagem limpa e bem fechada. Produto contaminado **não deve ser vendido** — descarte e refaça com a higiene reforçada.",chips:["O que é conservante?","Validade do produto"]},{id:"conservante",t:"O que é conservante?",q:["o que é conservante","preciso de conservante","qual conservante usar","posso não usar conservante","quanto de conservante","para que serve o conservante","conservante é obrigatório","conservante de produto de limpeza","sem conservante estraga"],k:["conservante"],a:'O **conservante** protege o produto de **mofo, fungos e bactérias**, principalmente em produtos com muita água (sabão líquido, detergente, amaciante, shampoo). Sem ele, o produto pode azedar ou criar limo em poucos dias.\n\nUse sempre na **dose indicada na fórmula**, adicionando no final. Produtos muito ácidos, alcalinos ou com alto teor de álcool/cloro são menos propensos, mas siga a fórmula. Veja mais no **glossário** (pergunte "o que é Kathon" ou "benzoato de sódio").',chips:["Cheiro ruim / produto estragou","Validade do produto"]},{id:"validade",t:"Validade do produto",q:["validade do produto","quanto tempo dura","prazo de validade","quanto tempo o produto dura","vence","tempo de prateleira","posso estocar quanto tempo","data de validade no rótulo","qual validade colocar","durabilidade"],k:["validade","prateleira","durabilidade"],a:"A validade depende da **fórmula, do conservante, da higiene e do armazenamento** — não existe um número único. Para vender, o ideal é fazer **testes de estabilidade** do seu lote e definir a validade com base neles (o Guia de Legalização explica o que colocar no rótulo).\n\nPara durar mais: **conservante na dose certa, embalagem limpa e bem fechada**, local **fresco e ao abrigo do sol**.",chips:["Como armazenar?","Rótulo"]},{id:"armazenar",t:"Como armazenar?",q:["como armazenar","onde guardar o produto","como guardar","armazenamento","posso deixar no sol","guardar matéria-prima","estoque dos insumos","como estocar","local de armazenamento","guardar no calor"],k:["armazenar","guardar","estocar"],a:"Boas práticas de armazenamento:\n\n• Local **fresco, seco, ventilado e ao abrigo do sol**.\n• Embalagens **bem fechadas e rotuladas** (nome + data de fabricação + cuidados).\n• **Nunca** guarde em garrafas de bebida/alimento.\n• Separe **ácidos, soda e cloro** uns dos outros.\n• Longe de **crianças, animais e alimentos**.\n• Insumos: mantenha nas embalagens originais, bem tampadas.",chips:["Cuidados de segurança","Validade do produto"]},{id:"embalagem",t:"Que embalagem usar?",q:["que embalagem usar","qual frasco","onde comprar embalagem","frascos para envasar","galão","tipo de embalagem","garrafa pet serve","embalagem para shampoo","embalagem para perfume","embalagem para vender","envase","como envasar","tampa dosadora","pulverizador"],k:["embalagem","envasar","frasco"],a:'A embalagem depende do produto — **cada fórmula traz a sugestão** (veja "Fragrância, Cor e Embalagem" dentro dela). De forma geral:\n\n• Use embalagens **novas ou muito bem higienizadas**, de **plástico (PET/PEAD) compatível** com o produto.\n• **Nunca** reaproveite embalagens de alimento/bebida.\n• Para ácidos e cloro, use embalagens **adequadas e resistentes**.\n• O **rótulo** precisa estar correto para vender (veja o Guia de Legalização).\n\nFornecedores de embalagens estão na lista do app.',chips:["Fornecedores","Rótulo"]},{id:"equipamentos",t:"Que equipamentos preciso?",q:["que equipamentos preciso","o que preciso para começar a fabricar","preciso de balança","que utensílios","material para produzir","qual recipiente usar","tanque de inox","misturador","agitador","posso misturar à mão","pode usar balde","lista de materiais","o que comprar para fazer","investimento inicial"],k:["equipamentos","utensílios","balança","balde","misturador"],a:"Para começar em **lotes pequenos**, o básico é:\n\n• **Balança** (de preferência de precisão, 1 g ou menos) e **medidores/seringas**\n• **Recipiente** de plástico (PEAD) ou inox, limpo, com marcação de litros\n• **Pá/colher** de plástico ou inox para misturar **devagar**\n• **Fita de pH**\n• **EPIs:** luvas, óculos e máscara\n• Funil, peneira e **embalagens** limpas\n\nEvite recipientes de **alumínio ou ferro** com ácidos/alcalinos fortes. Para volumes maiores, o ideal é um tanque com **agitador**. Valores de investimento variam muito — use a **Calculadora de Lucro** para simular.",chips:["Como fazer lote pequeno?","Ferramentas bônus"]},{id:"lote",t:"Como fazer lote pequeno?",q:["como fazer lote pequeno","reduzir a fórmula","quero fazer só 5 litros","fórmula para menos litros","regra de três","diminuir a quantidade","adaptar para menos litros","converter litros","a fórmula é para quantos litros","quantidade para 1 litro","como adaptar a receita","calcular quantidade","fazer menos"],k:["lote pequeno","regra de três","reduzir"],a:'As fórmulas profissionais são calculadas para **100 litros**. Para fazer menos, é uma regra de três: **quantidade ÷ 100 × litros que você quer**. (Ex.: para 10 L, divida tudo por 10; para 5 L, por 20.)\n\n👉 Eu calculo pra você! Diga o produto e o volume, por exemplo: **"quero fazer 10 litros de multiuso"**.\n\nEm lotes pequenos, use balança de precisão e **faça um teste antes** de produzir mais.',chips:["Quero fazer 10 litros de multiuso","Quero fazer 5 litros de sabão líquido"]},{id:"agua",t:"Que água usar?",q:["que água usar","água da torneira serve","água destilada","água de poço","precisa de água deionizada","qual água para fabricar","água filtrada","água dura","posso usar água da torneira"],k:["água dura","deionizada","destilada"],a:'Dá para usar **água comum (torneira/poço)** em muitos produtos, mas a **qualidade da água muda o resultado**. Água muito **dura** (com muito cálcio/magnésio) atrapalha espuma e pode turvar — o **EDTA** ajuda a controlar. Para produtos sensíveis (perfumes, cosméticos, pretinho), prefira água **filtrada, deionizada ou destilada**.\n\nVeja no glossário os itens "Água comum" e "Água deionizada/destilada".',chips:["O que é EDTA?"]},{id:"cor",t:"Que corante usar?",q:["que corante usar","quanto de corante","corante mancha","cor do produto","corante para detergente","qual cor usar","o corante não dissolve","corante sujou a roupa","cor mudou","a cor desbota"],k:["corante"],a:'Use **corantes próprios para produtos de limpeza**, em **pouquíssima quantidade** (q.s. = "quanto baste") e **diluídos antes** em um pouco de água para não manchar nem formar pontos escuros. Corante em excesso pode **manchar roupas e superfícies**.\n\nCada fórmula sugere a cor (veja "Fragrância, Cor e Embalagem"). Se a cor desbotou, pode ser **sol**, pH ou incompatibilidade — guarde ao abrigo da luz.',chips:["Que embalagem usar?"]},{id:"substituir",t:"Posso trocar um ingrediente?",q:["posso trocar um ingrediente","não achei o insumo","posso usar outro tensoativo","tem substituto","o que usar no lugar","trocar marca","substituir o insumo","não encontrei na minha cidade","posso trocar por outro","alternativa para o ingrediente"],k:["substituto","substituir","trocar ingrediente"],a:'Em muitos casos sim. O **glossário** mostra, para cada insumo, a coluna **"Substituto"**. Mas atenção: trocar ingrediente pode mudar **viscosidade, espuma, pH e cheiro**; e a concentração importa (ex.: LESS 27% ≠ LESS 70%).\n\nSempre faça **lote teste pequeno** primeiro. Me pergunte por um insumo específico: **"substituto do LESS"**, por exemplo.',chips:["Substituto do LESS","Glossário de insumos"]},{id:"rende",t:"Quanto rende o produto?",q:["quanto rende","rendimento","posso diluir mais","diluir para render","como diluir","rende quantos litros","dá para colocar mais água","quanto de água adicionar","diluição do produto"],k:["rendimento","diluir"],a:'Cada fórmula tem uma tabela de **Diluição** (uso direto, rendimento 1:1 etc.). Diluir demais enfraquece a limpeza e pode comprometer a conservação.\n\nDiga a fórmula e eu mostro a diluição dela: por exemplo, **"diluição do multiuso tradicional"**.',chips:["Diluição do multiuso tradicional"]},{id:"comecar",t:"Por onde começo?",q:["por onde começo","primeiros passos","sou iniciante o que faço primeiro","nunca fiz o que fazer","como começar do zero","qual fórmula começar","plano para começar","qual a melhor fórmula para iniciar","qual produto vende mais","o que fabricar primeiro","como iniciar o negócio","passo a passo para começar"],k:["começar","iniciar","primeiros passos"],a:'Um caminho simples para começar:\n\n1. **Escolha 1 ou 2 fórmulas de entrada** (as de uso diário, como multiuso, sabão líquido ou shampoo — são as mais vendidas).\n2. Veja os insumos no **glossário** e onde comprar na lista de **fornecedores**.\n3. Faça um **lote teste pequeno** (use "quero fazer 5 litros") e valide cheiro, espuma, viscosidade e pH.\n4. **Venda antes de fabricar em escala:** valide com amostras e pré-encomendas.\n5. Calcule **custo e preço** nas ferramentas bônus.\n6. **Regularize** o negócio com o Guia de Legalização antes de vender em escala.\n\nO capítulo **"Plano de 30 dias"** do Guia de Legalização organiza esse roteiro dia a dia.',chips:["Plano de 30 dias","Como calcular o preço de venda","Quero fazer 5 litros de multiuso"]},{id:"precificar",t:"Como calcular o preço de venda",q:["como calcular o preço de venda","quanto cobrar","como precificar","qual preço vender","calcular custo por litro","quanto de lucro dá","quanto posso ganhar","quanto lucro por litro","margem de lucro","formar preço","que preço cobrar","qual preço cobrar","quanto devo cobrar","preço de venda do litro","quanto vale o litro","como saber meu lucro","dá dinheiro","dá lucro"],k:["precificar","lucro","margem","quanto cobrar"],a:'Para formar preço, some o **custo dos insumos por litro** + **embalagem, rótulo, perdas, frete, impostos e seu tempo**, e aplique a margem que quiser.\n\nCada fórmula mostra o **custo estimado e um argumento de venda** (abra a fórmula ou pergunte "custo do multiuso"). E as ferramentas bônus fazem as contas por você:\n\n• 💰 **Precificação Automática** · 📊 **Calculadora de Lucro**\n\n⚠️ Os valores são **referências**: custos variam por região e fornecedor, e eu não prometo ganhos — faça as contas com os seus números.',chips:["Ferramentas bônus","Custo do multiuso"]},{id:"vender_onde",t:"Como e onde vender?",q:["como vender","onde vender","como conseguir clientes","como divulgar","vender no instagram","vender para mercado","vender na internet","quem compra","estratégia de vendas","primeiros clientes","posso vender para lojas","como achar clientes","preciso de loja","marketing"],k:["vender","clientes","divulgar"],a:'O curso mostra o caminho: **valide antes de fabricar** — apresente amostras e colete pré-encomendas (vizinhança, comércios, condomínios, oficinas, lava-jatos, salões, redes sociais) e só depois produza em escala. Os produtos de **uso diário** têm venda recorrente.\n\nNo Guia de Legalização, o capítulo **"Venda Antes de Fabricar"** detalha isso, e cada fórmula traz um **argumento de venda** pronto. Para vender com segurança, regularize antes de escalar.',chips:["Venda antes de fabricar","Posso vender os produtos?","Como calcular o preço de venda"]},{id:"posso_vender",t:"Posso vender os produtos?",q:["posso vender os produtos","posso vender sem cnpj","preciso de cnpj para vender","preciso de anvisa","posso vender em casa","é legal vender","preciso de licença","vender sem registro","posso vender produto de limpeza feito em casa","qual a lei para vender","preciso de autorização","fabricar em casa para vender"],k:["vender sem cnpj","autorização"],a:"Para **fabricar e vender** produtos de limpeza e automotivos há **exigências legais** (notificação/registro na ANVISA conforme o tipo de produto, rótulo correto, responsável técnico, empresa, licença sanitária etc.). Um caminho mais simples para começar é **revender produtos prontos de fabricantes regularizados**.\n\nO **Guia de Legalização** explica tudo passo a passo, em linguagem simples. As regras variam por produto e município — confirme sempre com os órgãos competentes.",chips:["Posso começar como MEI?","Notificação ANVISA","Guia de Legalização"]},{id:"mei",t:"Posso começar como MEI?",q:["posso começar como mei","mei pode fabricar","sou mei posso fabricar","mei ou me","qual empresa abrir","tipo de empresa","preciso abrir empresa","microempresa","cnpj mei","mei vende produto de limpeza","qual cnpj usar"],k:["mei","me","cnpj"],a:'Sim, dá para **começar estudando as fórmulas e planejando sua linha**. Para vender como **MEI**, um caminho é **revender produtos prontos de fabricantes regularizados**. Já para **fabricar e vender suas próprias fórmulas**, é necessário atuar como **ME** (ou outro porte compatível) e cumprir as exigências de licenciamento e regularização de cada produto.\n\nO curso ensina a parte técnica; ele **não substitui a formalização**. O Guia de Legalização tem o capítulo **"Abrindo Sua Empresa"**.',chips:["Abrir empresa","Notificação ANVISA"]},{id:"guia_leg",comprar:"leg",t:"Guia de Legalização",q:["guia de legalização","o que tem no guia de legalização","legalização","o guia ensina a legalizar","como legalizar meu negócio","regularizar produto","quais capítulos","capítulos do guia","o que ensina a legalização","quero comprar o guia de legalização","como compro o guia","quanto custa o guia de legalização","comprar o guia"],k:["legalização","guia"],a:function(a,o){var e=o.dados().LG||[];return"⚖️ O **Guia de Legalização** tem 9 capítulos:\n\n"+(e.length?e.map(function(a){return a.num+". "+a.title}).join("\n"):"1. Os 3 Caminhos para Começar\n2. Venda Antes de Fabricar\n3. O Que Você Pode Vender\n4. Notificação ANVISA Passo a Passo\n5. Rótulo Certo desde o Início\n6. Responsável Técnico\n7. Abrindo Sua Empresa\n8. Licença Sanitária e AFE\n9. Checklist Final e Plano de 30 Dias")+'\n\nPergunte sobre qualquer tema (ex.: "como notificar na ANVISA", "preciso de responsável técnico?") que eu te mostro o capítulo, se você já tiver o Guia liberado.'},chips:["Notificação ANVISA","Rótulo","Abrir empresa","Plano de 30 dias"]},{id:"clube",t:"O que é o Clube da Renda Extra?",q:["o que é o clube","clube da renda extra","comunidade dos alunos","tem comunidade","grupo de alunos","onde tiro dúvidas com outros alunos","fórum","tem grupo","tem grupo no whatsapp","como entro na comunidade","comunidade luveris","conversar com outros alunos","compartilhar meus resultados","postar minhas fotos"],k:["clube","comunidade","fórum"],only:["full","ess"],a:function(a){var o=a.vars&&a.vars.clube&&a.vars.clube();return o?{text:"👥 O **Clube da Renda Extra** é a comunidade exclusiva dos alunos: tire dúvidas, mostre seus resultados e troque dicas com quem está no mesmo caminho — sem precisar de WhatsApp.\n\nPara entrar, use o **mesmo e-mail da compra**. Você também pode instalar o Clube na tela inicial, como um app.",btns:[{l:"👥 Abrir o Clube",url:o}],chips:["Como instalar o app"]}:"O **Clube da Renda Extra** é a comunidade exclusiva dos alunos, para tirar dúvidas, mostrar resultados e trocar dicas. Ele ainda não está liberado para o seu acesso — assim que abrir, você vê um aviso na tela Início do app."}},{id:"fornecedores",t:"Fornecedores",q:["fornecedores","onde comprar os insumos","onde compro matéria-prima","lista de fornecedores","onde achar os ingredientes","distribuidora de produtos químicos","comprar tensoativo","onde comprar lauril","casa de produtos químicos","onde comprar embalagens","comprar pela internet"],k:["fornecedor","matéria-prima","comprar insumo"],a:'O app tem uma lista de **fornecedores de insumos e embalagens de todo o Brasil**, separados por região, além de dicas de **busca em marketplaces** (Mercado Livre, Shopee, Amazon). 📍\n\n👉 Diga **o seu estado ou cidade** (ex.: "fornecedores em Pernambuco") que eu filtro para você.',btns:[{l:"📍 Abrir lista de fornecedores",go:"supp"}],chips:["Fornecedores em Pernambuco","Fornecedores em São Paulo","Fornecedores online"]},{id:"marketplace",t:"Dicas para comprar em marketplace",q:["dicas para comprar em marketplace","como comprar no mercado livre","o que buscar na shopee","termos de busca","como pesquisar insumo n ido","Fórmula de desinfetante","Fórmula de multiuso","Quero fazer 10 litros de multiuso","Meu produto ficou ralo","Muita espuma / pouca espuma","Como medir o pH?"]},glossario:{text:'📚 **Glossário** — pergunte por qualquer insumo ("o que é LESS?", "preço da soda", "substituto do EDTA"):',chips:["O que é LESS?","O que é EDTA?","Para que serve a soda cáustica?","O que é goma xantana?","Substituto do LESS","Fornecedores"]},compras:{text:"💳 **Compras e garantia** — toque numa pergunta:",chips:["Quanto custa?","Quais as formas de pagamento?","Garantia e reembolso","É seguro comprar?","Tem desconto ou cupom?","Outros produtos disponíveis"]},negocio:{text:"⚖️ **Legalização e vendas** — o que você quer saber?",chips:["Posso vender os produtos?","Posso começar como MEI?","Notificação ANVISA","Como calcular o preço de venda","Por onde começo?","Plano de 30 dias"]},seguranca:{text:"🥽 **Segurança** — o básico para produzir sem risco:",chips:["Cuidados de segurança","O que nunca misturar","Ordem de adição dos ingredientes","E se eu me queimar?"]},clube:{text:"👥 **Clube da Renda Extra** — o que você quer saber?",chips:["Como postar no clube?","Como entro no clube?","Regras do clube","Falar com o João"]}}}("undefined"!=typeof window?window:globalThis),function(a){var o="(81) 3196-3052",e=["clube"],r=[{id:"c_entrar",t:"Como entro no clube?",only:e,q:["como entro no clube","como entrar na comunidade","como faço login no clube","não consigo entrar no clube","e-mail não encontrado no clube","não sou aluno","acesso ao clube","qual e-mail uso no clube","preciso de senha no clube","login do clube"],k:["entrar clube"],a:"Para entrar no Clube, digite o **mesmo e-mail da sua compra** (de qualquer um dos cursos). Não precisa de senha. 🔓\n\nSe aparecer que o e-mail não foi encontrado: confira a digitação, tente o outro e-mail que você possa ter usado, e se ainda assim não entrar, **chame o suporte** (**"+o+"**). Quem ainda não é aluno pode conhecer os cursos na própria tela de entrada.",btns:["wa"],chips:["Esqueci qual e-mail usei","Paguei e não liberou"]},{id:"c_postar",t:"Como postar no clube?",only:e,q:["como postar no clube","como criar uma publicação","como faço uma pergunta","como publicar","como tirar dúvida no clube","onde escrevo minha dúvida","botão de nova publicação","como postar uma foto","nova publicação","criar post","como compartilhar meu resultado"],k:["postar","publicar","nova publicação"],a:"Toque no botão **+ / Nova publicação**, escolha a **categoria**, escreva o título (opcional) e o texto, e se quiser **anexe até 3 fotos**. Depois é só publicar! ✍️\n\nCategorias:\n• **Dúvidas** — perguntas sobre fórmulas e produção\n• **Resultados** — mostre o que você fez\n• **Dicas e receitas** — compartilhe o que aprendeu\n• **Avisos da equipe** — novidades (só a equipe publica)\n\nDica: numa dúvida, conte **qual fórmula, o que fez, o que esperava e o que aconteceu**. Assim a resposta vem mais rápida!",chips:["Por que minha publicação foi bloqueada?","Regras do clube"]},{id:"c_comentar",t:"Como comentar e curtir?",only:e,q:["como comentar","como responder uma dúvida","como curtir","como responder um post","posso comentar com foto","curtir publicação","responder alguém","enviar foto no comentário"],k:["comentar","curtir","responder"],a:"Abra a publicação, escreva no campo de comentário (dá para **anexar uma foto**) e envie. Para curtir, toque no **coração** ♡ da publicação. 💬",chips:["Melhor resposta e dúvida resolvida","Regras do clube"]},{id:"c_resolvido",t:"Melhor resposta e dúvida resolvida",q:["melhor resposta","marcar como resolvido","dúvida resolvida","fechar dúvida","como marco a melhor resposta","quem marca como resolvida","o que significa resolvido","selo de resolvido"],k:["resolvido","melhor resposta"],only:e,a:"Quando alguém responde sua dúvida, você pode marcar essa resposta como **melhor resposta** ✅ — a dúvida fica marcada como **resolvida** e ajuda quem tiver o mesmo problema depois. Só **quem perguntou** (ou a equipe) pode marcar ou desmarcar.",chips:["Como postar no clube?"]},{id:"c_bloqueada",t:"Por que minha publicação foi bloqueada?",only:e,q:["por que minha publicação foi bloqueada","não consigo postar link","não deixa colocar telefone","não aceita meu comentário","erro ao publicar","não deixa postar","limite de publicações","posso colocar meu instagram","posso divulgar meu produto","posso colocar whatsapp","posso colocar link","post foi apagado","meu post sumiu","foi removida"],k:["bloqueada","link","divulgar","removida"],a:"O Clube não é espaço de divulgação, então **links, @perfis e telefones não são aceitos** nas publicações e comentários. Se aparecer erro ao publicar, veja se seu texto tem algum desses itens.\n\nExistem também limites contra spam: até **5 publicações por hora** e **30 comentários por hora**. Se sua publicação sumiu, ela pode ter sido removida pela equipe por quebrar os combinados — fale com o João se achar que foi engano.",btns:["wa"],chips:["Regras do clube"]},{id:"c_regras",t:"Regras do clube",only:e,q:["regras do clube","combinados","o que pode e o que não pode","regras da comunidade","posso postar qualquer coisa","o que é proibido","termos de uso do clube","comportamento"],k:["regras","combinados","proibido"],a:"📜 **Combinados do Clube:**\n\n• Respeite todos: aqui todo mundo está aprendendo.\n• Sem links, @perfis ou telefones — aqui não é espaço de divulgação.\n• Descreva sua dúvida com detalhes (o que fez, o que esperava, o que aconteceu).\n• Não peça nem passe o conteúdo dos cursos para quem não é aluno.\n• Segurança em primeiro lugar: use luvas e ventilação ao testar fórmulas.\n\nPublicações que quebram os combinados podem ser removidas.",chips:["Como denunciar?"]},{id:"c_denunciar",t:"Como denunciar?",only:e,q:["como denunciar","denunciar publicação","denunciar comentário","alguém está me ofendendo","conteúdo inadequado","reportar post","tem spam","tem alguém fazendo propaganda","conteúdo ofensivo","bloquear alguém"],k:["denunciar","reportar","ofensa"],a:"Em qualquer publicação ou comentário, toque no menu **⋯** e escolha **Denunciar**. A equipe analisa e remove o que quebrar os combinados — a denúncia é discreta. 🚩\n\nSe for algo urgente ou grave, avise também o João pelo WhatsApp **"+o+"**.",btns:["wa"]},{id:"c_apagar",t:"Como apagar minha publicação?",only:e,q:["como apagar minha publicação","excluir post","apagar comentário","editar minha publicação","posso editar o post","errei no post","remover meu comentário","deletar publicação"],k:["apagar","excluir","editar"],a:"Nas suas próprias publicações e comentários, toque no menu **⋯** e escolha **Apagar**. Por enquanto não dá para editar o texto depois de publicado: se errou, apague e publique de novo. 🗑️",chips:["Como postar no clube?"]},{id:"c_perfil",t:"Como mudar meu nome / avisos?",only:e,q:["como mudar meu nome","trocar nome no clube","perfil","avisos por e-mail","parar de receber e-mails","não quero receber e-mail","notificações do clube","como sair do clube","desativar avisos","editar perfil","meu nome aparece errado","sair"],k:["perfil","nome","avisos","notificações"],a:"Toque no seu **nome/foto no topo** para abrir o **Perfil**. Lá você pode:\n\n• Trocar o **nome exibido**\n• Ligar/desligar os **avisos por e-mail** quando alguém responder suas publicações\n• Ver os **combinados**\n• **Sair** da conta\n\nSeu perfil mostra um selo do(s) curso(s) que você tem.",chips:["Regras do clube"]},{id:"c_selo",t:"O que é o selo do curso?",only:e,q:["o que é o selo","selo do curso","etiqueta no perfil","o que significa o selo","por que aparece fdl ou ap","aluno de qual curso","selos","equipe"],k:["selo","equipe"],a:"O selo ao lado do nome mostra **de qual curso a pessoa é aluna** (Fábrica da Limpeza, Auto Pro…), para você saber o contexto de quem está respondendo. Respostas com o selo **Equipe** vêm do time do João. ✅",chips:["Como comentar e curtir?"]},{id:"c_instalar",t:"Como instalar o clube no celular?",only:e,q:["como instalar o clube","instalar a comunidade no celular","colocar o clube na tela inicial","baixar o clube","tem app do clube","clube na tela de início","instalar no iphone o clube","instalar no android o clube"],k:["instalar clube"],a:"O Clube também pode virar um app na sua tela inicial:\n\n**iPhone (Safari):** toque em **⬆ Compartilhar → Adicionar à Tela de Início → Adicionar**.\n**Android (Chrome):** toque nos **⋮ → Instalar aplicativo → Instalar**.\n\n⚠️ No iPhone, abra pelo **Safari** (não funciona dentro do navegador do WhatsApp/Instagram).",btns:[{l:"📲 Instalar agora",install:1}]},{id:"c_gratis",t:"O clube é pago?",only:e,q:["o clube é pago","quanto custa o clube","preciso pagar para entrar","é grátis o clube","tem mensalidade o clube","clube é gratuito","custo da comunidade"],k:["clube pago","clube grátis"],a:"O Clube da Renda Extra é **exclusivo para alunos** dos cursos, sem custo extra — basta entrar com o e-mail da sua compra. 🎉",chips:["Como entro no clube?"]},{id:"c_cursos",t:"Quais cursos existem?",only:e,q:["quais cursos existem","quais são os cursos","qual a diferença entre os cursos","fábrica da limpeza ou auto pro","qual curso é melhor","quero comprar um curso","cursos disponíveis","quero conhecer os cursos","qual curso escolher","linha automotiva","linha de limpeza"],k:["cursos","auto pro","fábrica da limpeza"],a:function(a){return{text:"🧪 Os cursos do João Silva:\n\n"+a.apps.map(function(a){return"• **"+a.nome+"** — "+a.desc}).join("\n")+"\n\nQuer ver os apps? Toque num dos botões. Se ainda não é aluno, também consigo te levar para o pagamento.",btns:a.apps.slice(0,4).map(function(a){return{l:a.nome,a:{t:"url",url:a.url}}}),chips:["Qual curso escolher?","Garantia de 30 dias"]}}}];(a.JOAO_KB=a.JOAO_KB||[]).push.apply(a.JOAO_KB,r),a.JOAO_MENU&&(a.JOAO_MENU.clube.chips=["Como entro no clube?","Como postar no clube?","Regras do clube","Como denunciar?","Falar com o João"])}("undefined"!=typeof window?window:globalThis),function(a){"use strict";var o='<img src="data:image/webp;base64,UklGRnwcAABXRUJQ     fetch('/api/login?email='+encodeURIComponent(em),{cache:'no-store'}).then(function(r){return r.json()}).then(function(d){if(d&&d.success)localStorage.setItem('joao_nome',JSON.stringify({e:em,n:d.nome||''}))}).catch(function(){})}catch(e){}}
  function iniciar(){
    if(!window.Joao||!Joao.mount)return;
    buscaNome();
    Joao.mount({
      id:"apess",kind:"ess",nome:"Fórmula Auto Pro Essencial",nomeCurto:"Fórmula Auto Pro Essencial",url:"https://formulaautoessencial.luverisgroup.com.br/",
      sections:[{"kind":"AF","key":"base","name":"Fórmula Auto Pro Essencial","price":"","desc":"20 receitas automotivas passo a passo","view":"auto"},{"kind":"LF","key":"limp","name":"50 Fórmulas de Limpeza","price":"R$ 9,90","desc":"amplie o catálogo com produtos de limpeza","view":"limpeza"},{"kind":"LG","key":"leg","name":"Guia de Legalização","price":"R$ 6,90","desc":"venda dentro da lei, passo a passo","view":"legal"},{"kind":"FORM","key":"form","name":"Fórmula Exclusiva","price":"R$ 24,90","desc":"3 a 5 fórmulas feitas para o seu negócio","view":"exclusiva"}],
      vars:{clube:function(){return CLUBE}},
      pessoa:function(){try{var em=localStorage.getItem('fap_email');var s=JSON.parse(localStorage.getItem('joao_nome')||'null');return s&&s.e===em?s.n:''}catch(e){return ''}},
      tema:{acc:'#E8720C',acc2:'#C45E08'},
      esconder:'.wa-float{display:none!important}',
      data:function(){return{AF:g('AF')||[],LF:g('LF')||[],PF:g('PF')||[],LG:g('LG')||[],AC:g('AC')||[],LC:g('LC')||[],PC:g('PC')||[],GL:g('GL')||[],SU:g('SU')||{},BO:g('BO')||[]}},
      can:function(kind,f){
        var S_=g('S')||{},A_=S_.access||{},adm=A_.admin,pv=g('PREVIEW_IDS')||[];
        var tem=f&&f.formula&&f.formula.length;
        if(kind==='AF')return !!((A_.base||adm||pv.indexOf(f.id)>=0)&&tem);
        if(kind==='LF')return !!((A_.limp||adm)&&tem);
        if(kind==='PF')return !!((A_.perf||adm)&&tem);
        if(kind==='LG')return !!((A_.leg||adm)&&f.content);
        return false;
      },
      open:function(kind,id){
        var f,pode=this.can;
        if(kind==='AF'){f=(g('AF')||[]).filter(function(x){return x.id===id})[0];go('auto-form',{autoForm:id,autoCat:f&&f.cat});}
        else if(kind==='LF'){f=(g('LF')||[]).filter(function(x){return x.id===id})[0];if(f&&pode('LF',f))go('limp-form',{limpForm:id,limpCat:f.cat});else go('limpeza');}
        else if(kind==='PF'){f=(g('PF')||[]).filter(function(x){return x.id===id})[0];if(f&&pode('PF',f))go('perf-form',{perfForm:id,perfCat:f.cat});else go('perfumes');}
        else if(kind==='LG'){f=(g('LG')||[]).filter(function(x){return x.id===id})[0];if(f&&pode('LG',f))go('legal-cap',{legCap:id});else go('legal');}
      },
      go:function(v){try{go(v)}catch(e){}},
      buy:function(k){
        try{_fapPixel('InitiateCheckout',{content_name:k})}catch(e){}
        try{localStorage.setItem('fap_buy_intent','1')}catch(e){}
        var u;try{u=(typeof ckUrl==='function')?ckUrl(k):(k==='base'?CHECKOUT_BASE:CHECKOUT_URLS[k])}catch(e){}
        window.open(u||CHECKOUT_BASE,'_blank');
      },
      has:function(k){var A_=(g('S')||{}).access||{};return !!(A_[k]||A_.admin)},
      install:function(){try{openInst()}catch(e){}},
      onMiss:function(q){
        if(enviados>=5)return;enviados++;
        try{fetch('https://pagamento.luverisgroup.com.br/api/joao',{method:'POST',mode:'cors',keepalive:true,headers:{'Content-Type':'text/plain'},body:JSON.stringify({q:String(q).slice(0,300),app:"apess"})}).catch(function(){})}catch(e){}
      }
    });
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',iniciar);else iniciar();
})();
</script>
